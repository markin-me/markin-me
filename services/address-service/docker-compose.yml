services:
  address-db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: markin_address
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d markin_address"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - address_db_data:/var/lib/postgresql/data

volumes:
  address_db_data:
