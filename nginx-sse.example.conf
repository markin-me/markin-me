# Пример конфигурации Nginx для SSE (Server-Sent Events)
# Добавьте этот location в ваш server { ... } блок.
#
# SSE держит соединение открытым. Без увеличенных таймаутов прокси
# разрывает соединение через 60 сек по умолчанию.

location /api/admin/orders/events {
    proxy_pass http://127.0.0.1:3000;  # или ваш upstream
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Увеличенные таймауты для длинных SSE-соединений (1 час)
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
